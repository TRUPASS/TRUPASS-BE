name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      mock-merchant: ${{ steps.filter.outputs.mock-merchant }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            gradle: &gradle
              - 'gradle/**'
              - 'gradlew'
              - '*.gradle.kts'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            core:
              - *gradle
              - 'core/**'
            mock-merchant:
              - *gradle
              - 'mock-merchant/**'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Testcontainers(PostgreSQL)는 러너의 Docker를 쓴다.
      - run: ./gradlew :spotlessCheck :core:build

  mock-merchant:
    needs: changes
    if: needs.changes.outputs.mock-merchant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :spotlessCheck :mock-merchant:build

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
