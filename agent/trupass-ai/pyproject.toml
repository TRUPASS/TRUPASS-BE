[project]
name = "trupass-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14,<3",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "tzdata",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
