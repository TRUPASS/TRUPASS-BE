spring:
  application:
    name: trupass-core
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trupass}
    username: ${POSTGRES_USER:trupass}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # access token 폐기 기준 시각 저장소(global/security/AccessTokenRevocationStore).
  # Redis가 죽어도 요청은 통과시키므로(fail-open), 기다리는 시간을 짧게 둔다. 기본값은 60초다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis가 죽어도 core는 정상이다(fail-open). health가 DOWN이 되면 배포 --wait 실패와 컨테이너 재시작으로 번진다.
    redis:
      enabled: false

# Spring Boot 기본 structured logging(JSON). MDC의 checkout_id가 필드로 함께 찍힌다.
logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

# 환경 변수로 덮어쓴다: TRUPASS_CLIENTS_MERCHANT, MOCK_MERCHANT_BASE_URL 등 (.env.example 참고)
trupass:
  # 외부 연동 구현체 선택 (global/config/ClientConfig)
  clients:
    merchant: mock # mock | duffel
    payment: mock # mock | toss
    audit: localfile # localfile | s3
  services:
    mock-merchant-base-url: ${MOCK_MERCHANT_BASE_URL:http://localhost:9001}
    agent-base-url: ${AGENT_BASE_URL:http://localhost:8001}
  http:
    connect-timeout: 2s
    read-timeout: 5s
  cors:
    allowed-origins: http://localhost:5173
  audit:
    local-dir: ./data/audit
  auth:
    google:
      # Google Cloud Console > API 및 서비스 > 사용자 인증 정보 > OAuth 2.0 클라이언트 ID (쉼표로 여러 개)
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
    jwt:
      secret: ${TRUPASS_JWT_SECRET:}
      access-token-ttl: 30m
      refresh-token-ttl: 14d

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always

trupass:
  auth:
    jwt:
      # TRUPASS_JWT_SECRET이 없거나 비어 있으면 이 값을 쓴다. prod에는 이 값이 없어 TRUPASS_JWT_SECRET이 없으면 뜨지 않는다.
      local-dev-secret: local-only-trupass-jwt-secret-change-me-0123456789

---
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

trupass:
  cors:
    # 예: https://trupass.vercel.app (쉼표로 여러 개)
    allowed-origins: ${TRUPASS_CORS_ALLOWED_ORIGINS}
