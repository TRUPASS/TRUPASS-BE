# 1단계 초안: EC2 한 대 + docker compose + Caddy(자동 TLS).
# EC2의 /opt/trupass 에 이 파일, caddy/Caddyfile, .env를 두고 실행한다.
#   IMAGE_TAG=sha-<커밋> docker compose -f docker-compose.prod.yml up -d
#
# 이미지는 main 머지 시 docker-publish.yml이 GHCR에 올린다.
# .env에는 .env.example 키에 더해 API_DOMAIN, ACME_EMAIL, TRUPASS_CORS_ALLOWED_ORIGINS가 필요하다.
name: trupass

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-merchant:
    image: ghcr.io/trupass/trupass-mock-merchant:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  core:
    image: ghcr.io/trupass/trupass-core:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TRUPASS_AUDIT_LOCAL_DIR: /app/data/audit
    volumes:
      - audit-data:/app/data/audit
    depends_on:
      postgres:
        condition: service_healthy
      mock-merchant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5

  agent:
    image: ghcr.io/trupass/trupass-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  audit-data:
